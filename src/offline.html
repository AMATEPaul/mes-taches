<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mes Tâches</title>
  <style>
    :root { --bg: #f7f6f3; --text: #1c1b19; --muted: #6b6862; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141413; --text: #ecebe7; --muted: #9b978f; } }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      display: grid; place-items: center; text-align: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      box-sizing: border-box;
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; line-height: 1.5; }
    a {
      display: inline-block; min-height: 44px; line-height: 44px; padding: 0 20px;
      border-radius: 8px; background: var(--text); color: var(--bg);
      font-weight: 600; text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Pas de connexion</h1>
    <p>Pour le tout premier lancement, Mes Tâches a besoin d’internet.<br>Ensuite, elle marche aussi sans connexion.</p>
    <a href="https://amatepaul.github.io/mes-taches/">Réessayer</a>
  </main>
</body>
</html>
